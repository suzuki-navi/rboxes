[package]
name = "rsealpacked"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rsealpacked"
path = "src/main.rs"

[profile.release]
lto = "thin"
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true 
debug = 0

[dependencies]
aes-gcm = "0.10"
scrypt = "0.11"
base64 = "0.21"
libc = "0.2"
sha2 = "0.10"
which = "6.0"